services:
  - type: web
    name: athletic-analysis
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start_render.sh
    healthCheckPath: /health
    disk:
      name: athletic-analysis-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athletic-analysis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_LOCAL_PATH
        value: /var/data
      - key: MEDIAPIPE_MODEL_PATH
        value: /var/data/models/pose_landmarker_lite.task
      - key: POSE_ESTIMATOR_BACKEND
        value: mediapipe
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: athletic-analysis-db
    databaseName: athletic_analysis
    user: athletic_analysis
    plan: basic-256mb
    postgresMajorVersion: "16"
