services:
  - type: web
    name: athletic-analysis
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start_render.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athletic-analysis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_LOCAL_PATH
        value: /tmp/athletic-analysis
      - key: MEDIAPIPE_MODEL_PATH
        value: /tmp/athletic-analysis/models/pose_landmarker_full.task
      - key: POSE_ESTIMATOR_BACKEND
        value: mediapipe
      - key: MAX_VIDEO_SIZE_MB
        value: "100"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://localhost"

databases:
  - name: athletic-analysis-db
    databaseName: athletic_analysis
    user: athletic_analysis
    plan: free
    postgresMajorVersion: "16"
