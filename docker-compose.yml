services:
  postgres:
    image: postgres:16-alpine
    container_name: athletic_analysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: athletic_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: athletic_analysis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Reservado para la Fase 8 (Celery + Redis). Aun no lo usa el backend.

  backend:
    build: .
    container_name: athletic_analysis_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./models:/app/models

volumes:
  postgres_data:
